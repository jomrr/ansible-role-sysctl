---
# role: sysctl
# file: molecule/resources/playbooks/verify.yml

- name: SYSCTL | Verify persistent and active hardening
  hosts: all
  gather_facts: false
  tasks:
    - name: SYSCTL | Verify managed file access and namespace settings
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: "{{ (playbook_dir ~ '/../sysctl_checks.py') | quote }} verify"
        executable: /usr/bin/python3
      changed_when: false
